  image:
    repository: egovio/core-ui
    tag: develop-548f854d1d-57
  namespace: demo
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://hcm-demo-assets.s3.ap-south-1.amazonaws.com/demo/globalConfigsCoreUIDemo.js type=text/javascript defer></script>
      <script src=https://hcm-demo-assets.s3.ap-south-1.amazonaws.com/analytics/analytics.js type=text/javascript ></script>
      ';" 


console:
  image:
    repository: egovio/console
    tag: ondo-proxy-f806f086a2-149
  namespace: demo
  central-instance-name: egov
  central-instance-build: true
  central-instance-enabled: true
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://hcm-demo-assets.s3.ap-south-1.amazonaws.com/demo/globalConfigsConsoleDemo.js type=text/javascript defer></script>
      <script src=https://hcm-demo-assets.s3.ap-south-1.amazonaws.com/analytics/analytics.js type=text/javascript async></script>
      ';"

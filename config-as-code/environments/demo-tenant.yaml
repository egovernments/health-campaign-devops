global:
  domain: hcm-demo.digit.org

# service:
#   additionalAnnotations: |
#     zuul/route-host: hcm-demo.digit.org

namespace: demo

disableAnnotationTimestamp: true

workbench-ui:
  image:
    repository: egovio/workbench-ui
    tag: master-6484adf
  namespace: demo
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://hcm-demo-assets.s3.ap-south-1.amazonaws.com/demo/globalConfigsWorkbenchDemo.js type=text/javascript ></script>
      <script src=https://hcm-demo-assets.s3.ap-south-1.amazonaws.com/analytics/consoleAnalyticsDemo.js type=text/javascript ></script>
      ';"  

dashboard-ui:
  image:
    repository: egovio/dashboard-ui
    tag: master-75290ce
  namespace: demo
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://egov-dev-assets.s3.ap-south-1.amazonaws.com/globalConfigsDashboardDemo.js type=text/javascript ></script>
      <script src=https://hcm-demo-assets.s3.ap-south-1.amazonaws.com/analytics/analytics.js type=text/javascript async></script>
      ';"
  heap: "-Xmx512m -Xms512m"
  memory_limits: 1024Mi
  
microplan-ui:
  image:
    repository: egovio/microplan-ui
    tag: master-88c8318
  namespace: demo
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://hcm-demo-assets.s3.ap-south-1.amazonaws.com/demo/globalConfigsMicroplanDemo.js type=text/javascript></script>
      <script src=https://hcm-demo-assets.s3.ap-south-1.amazonaws.com/analytics/analytics.js type=text/javascript ></script>
      ';" 


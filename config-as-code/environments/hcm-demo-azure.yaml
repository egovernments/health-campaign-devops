  azure-blob-container: "egov-filestore"
  # Slack Notification (optional - enable and provide webhook URL to use)
  slack-enabled: true
  # slack-webhook-url: "https://hooks.slack.com/services/xxx/xxx/xxx"
  slack-channel: "#filestore-malware-alerts"
  slack-username: "MalwareBot"
  slack-icon-emoji: ":warning:"
  # Email Notification (uses egov-notification-mail via Kafka)
  mail-enabled: true
  mail-notification-mode: "kafka"
  mail-alert-recipients: "security-team@example.com,lata.naik@egovernments.org,sruthi.prasad@egovernments.org"
  mail-alert-subject: "DIGIT Security Alert - Malware Detected"
  # Scan Settings
  scan-max-file-size-mb: "50"
  # Quarantine Settings
  quarantine-enabled: true
  quarantine-delete-original: true
  # JVM Settings
  heap: "-Xmx512m -Xms512m"
  memory_limits: "768Mi"


  is-s3-enabled: false
  minio-enabled: false
  fixed-bucketname: "egov-rainmaker" #add bucket name
  fixed-bucket-region: "ap-south-1" #add bucket region
  quarantine-bucketname: "egov-quarantine" #add quarantine bucket name

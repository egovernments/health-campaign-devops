global:
   domain: hcm-demo.digit.org ## Add your Domain Name "Eg: site.mydomain.com" Do not use the dummy domain
   setup: fullsetup
   hosts:
     - hcm-demo.digit.org
   schema:
     - mz
     - demo

cluster-configs:
    namespaces:  
      create: true
      values: [ backbone, cert-manager, egov, es-cluster, kafka-kraft, logging, monitoring, playground, demo ]
      
    root-ingress:
      cert-issuer: letsencrypt-prod
      namespace: egov
      appRoot: console
      serviceName: console
    
    configmaps:
        egov-config:
            namespace: [ egov, monitoring, es-cluster, demo ]
            data:
                db-host: hcm-demo-server-v2.postgres.database.azure.com ## Add db-host name eg: egov-demo.database.azure.com
                db-name: healthdemo ## Add db-name
                db-url: "jdbc:postgresql://hcm-demo-server-v2.postgres.database.azure.com:5432/healthdemo" ## example: jdbc:postgresql://egov-demo.postgres.database.azure.com:5432/egov_demo
                db-url-no-schema: "jdbc:postgresql://hcm-demo-server-v2.postgres.database.azure.com:5432/healthdemo"
                demo-db-url: "jdbc:postgresql://hcm-demo-server-v2.postgres.database.azure.com:5432/healthdemo?currentSchema=demo"
                domain: hcm-demo.digit.org ## Add your Domain Name
                redis-host: "redis.backbone.svc.cluster.local"
                redis-downsync-host: "redis.backbone.svc.cluster.local"
                egov-services-fqdn-name: https://hcm-demo.digit.org/ ## Add your Domain Name
                kibana-host: http://release-name-kibana.es-cluster:5601/
                kibana-base-path: kibana
                state-level-tenantid-length: "1"

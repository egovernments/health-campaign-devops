global:
  domain: hcm-demo.digit.org

# service:
#   additionalAnnotations: |
#     zuul/route-host: hcm-dev.digit.org

namespace: dev

disableAnnotationTimestamp: true

workbench-ui:
  image:
    repository: egovio/workbench-ui
    tag: master-9fcd8db
  namespace: dev
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://hcm-dev-assets.s3.ap-south-1.amazonaws.com/dev/globalConfigsWorkbenchdev.js type=text/javascript ></script>
      <script src=https://hcm-dev-assets.s3.ap-south-1.amazonaws.com/analytics/consoleAnalyticsdev.js type=text/javascript ></script>
      ';"  

dashboard-ui:
  image:
    repository: egovio/dashboard-ui
    tag: master-88c8318
  namespace: dev
  custom-js-injection: |
    sub_filter.conf: "
      sub_filter  '<head>' '<head>
      <script src=https://egov-dev-assets.s3.ap-south-1.amazonaws.com/globalConfigsDashboarddev.js type=text/javascript ></script>
      <script src=https://hcm-dev-assets.s3.ap-south-1.amazonaws.com/analytics/analytics.js type=text/javascript async></script>
      ';"
  heap: "-Xmx512m -Xms512m"
  memory_limits: 1024Mi
  

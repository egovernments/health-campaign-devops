# Common Labels
labels:
  app: "health-attendance"
  group: "digit-works"

# Ingress Configs
ingress:
  namespace: egov
  enabled: true
  zuul: true
  context: "health-attendance"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "attendance_schema"
    image:
      repository: "health-attendance-db"

# Container Configs
image:
  repository: "health-attendance"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/health-attendance/health"
  readinessProbePath: "/health-attendance/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx192m -Xms192m"
java-args: ""
egov-mdms-service-host-key: "mdms-v2"
egov-mdms-service-endpoint-key: "/mdms-v2/v1/_search"

attendance-log-kafka-create-topic: save-attendance-log
attendance-log-kafka-update-topic: update-attendance-log
attendance-register-kafka-create-topic: save-attendance
attendance-register-kafka-update-topic: update-attendance
attendance-staff-kafka-create-topic: save-staff
attendance-staff-kafka-update-topic: update-staff
attendance-attendee-kafka-create-topic: save-attendee
attendance-attendee-kafka-update-topic: update-attendee
project-staff-attendance-topic: project-staff-attendance-topic
project-management-system-kafka-update-topic: update-project
attendance-log-kafka-bulk-create-topic: save-attendance-log-bulk-health
attendance-log-kafka-bulk-update-topic: update-attendance-log-bulk-health
attendance-register-kafka-muster-status-update-topic: muster-roll-status-update

# Additional Container Envs
env: |
  - name: SERVER_PORT
    value: "8080"
  - name: SERVER_SERVLET_CONTEXT_PATH
    value:  "/health-attendance"
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: {{ index .Values "spring-kafka-consumer-group-id" | default "egov-attendance-service" | quote }}
  - name: SERVER_CONTEXT_PATH
    value: /health-attendance
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-mdms-service
  - name: EGOV_MDMS_SEARCH_ENDPOINT
    value: "/mdms-v2/v1/_search"
  - name: EGOV_MDMS_V2_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-mdms-service
  - name: EGOV_MDMS_V2_SEARCH_ENDPOINT
    value: "/mdms-v2/v1/_search"
  - name: EGOV_MDMS_PATH
    value: "mdms-v2/v1/_search"
  - name: MDMS_PATH
    value: "mdms-v2/v1/_search"
  - name: EGOV_EXPENSE_CALCULATOR_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: health-expense-calculator
  - name: EGOV_EXPENSE_CALCULATOR_BILLING_PERIOD_SEARCH_ENDPOINT
    value: {{ index .Values "egov-expense-calculator-billing-period-search-endpoint" | quote }}
  - name: EGOV_MUSTER_ROLL_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: health-muster-roll
  - name: EGOV_MUSTER_ROLL_SEARCH_ENDPOINT
    value: {{ index .Values "egov-muster-roll-search-endpoint" | quote }}
  - name: WORKS_INDIVIDUAL_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: individual
  - name: EGOV_HRMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-hrms
  - name: EGOV_HRMS_SEARCH_ENDPOINT
    value: egov-hrms/employees/_search
  - name: EGOV_PROJECT_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: project
  - name: EGOV_PROJECT_STAFF_SEARCH_ENDPOINT
    value: project/staff/v1/_search
  - name: EGOV_FILESTORE_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-filestore
  - name: EGOV_IDGEN_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-idgen
  - name: ATTENDANCE_LOG_KAFKA_CREATE_TOPIC
    value: {{ index .Values "attendance-log-kafka-create-topic" | quote}}
  - name: ATTENDANCE_LOG_KAFKA_UPDATE_TOPIC
    value: {{ index .Values "attendance-log-kafka-update-topic" | quote}}
  - name: ATTENDANCE_REGISTER_KAFKA_CREATE_TOPIC
    value: {{ index .Values "attendance-register-kafka-create-topic" | quote}}
  - name: ATTENDANCE_REGISTER_KAFKA_UPDATE_TOPIC
    value: {{ index .Values "attendance-register-kafka-update-topic" | quote}}
  - name: ATTENDANCE_STAFF_KAFKA_CREATE_TOPIC
    value: {{ index .Values "attendance-staff-kafka-create-topic" | quote}}
  - name: ATTENDANCE_STAFF_KAFKA_UPDATE_TOPIC
    value: {{ index .Values "attendance-staff-kafka-update-topic" | quote}}
  - name: ATTENDANCE_ATTENDEE_KAFKA_CREATE_TOPIC
    value: {{ index .Values "attendance-attendee-kafka-create-topic" | quote}}
  - name: ATTENDANCE_ATTENDEE_KAFKA_UPDATE_TOPIC
    value: {{ index .Values "attendance-attendee-kafka-update-topic" | quote}}
  - name: WORKS_INDIVIDUAL_SEARCH_ENDPOINT
    value: individual/v1/_search
  - name: PROJECT.STAFF.ATTENDANCE.TOPIC
    value: {{ index .Values "project-staff-attendance-topic" | quote}}
  - name: SPRING_REDIS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-host
  - name: EGOV_BOUNDARY_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: boundary-service
  - name: EGOV_BOUNDARY_SEARCH_URL
    value: "/boundary-service/boundary/_search"
  - name: SPRING_REDIS_PORT
    value: "6379"
  - name: SPRING_CACHE_TYPE
    value: redis
  - name: SPRING_CACHE_REDIS_TIME-TO-LIVE
    value: "60"
  - name: SPRING_CACHE_AUTOEXPIRY
    value: "true"
  - name: EGOV_PROJECT_SEARCH_ENDPOINT
    value: "project/v1/_search"
  - name: PROJECT_MANAGEMENT_SYSTEM_KAFKA_UPDATE_TOPIC
    value: {{ index .Values "project-management-system-kafka-update-topic" | quote}}
  - name: ATTENDANCE_REGISTER_FIRST_STAFF_INSERT_ENABLED
    value: "true"
  - name: ATTENDANCE_REGISTER_OPEN_SEARCH_ENABLED_ROLES
    value: SUPERUSER,EMPLOYEE,DISTRICT_SUPERVISOR,SYSTEM_ADMINISTRATOR,NATIONAL_SUPERVISOR,DISTRIBUTOR,CAMPAIGN_SUPERVISOR,CAMPAIGN_MANAGER,SUPERVISOR
  - name: ATTENDANCE_REGISTER_SEARCH_CHECK_PROJECT_ENABLED
    value: "true"
  - name: ATTENDANCE_REGISTER_REVIEW_STATUS_ENABLED
    value: "true"
  - name: ATTENDANCE_REGISTER_REVIEW_STATUS_INIT_VALUE
    value: "PENDINGFORAPPROVAL"
  - name: ATTENDANCE_REGISTER_BOUNDARY_SEARCH_ENABLED
    value: "true"
  - name: ATTENDANCE_REGISTER_STATUS_MAP
    value: "{APPROVED: 'APPROVED', PENDINGFORAPPROVAL: 'PENDINGFORAPPROVAL'}"
  - name: ATTENDANCE_REGISTER_FIRST_OWNER_STAFF_ENABLED
    value: "true"
  - name: ATTENDANCE_LOG_OPEN_SEARCH_ENABLED
    value: "true"
  - name: PROJECT_STAFF_ATTENDANCE_REGISTER_ENABLED
    value: "false"
  {{- if index .Values "attendance-register-default-offset" }}
  - name: ATTENDANCE_REGISTER_DEFAULT_OFFSET
    value: {{ index .Values "attendance-register-default-offset" | quote }}
  {{- end }}
  {{- if index .Values "attendance-register-default-limit" }}
  - name: ATTENDANCE_REGISTER_DEFAULT_LIMIT
    value: {{ index .Values "attendance-register-default-limit" | quote }}
  {{- end }}
  {{- if index .Values "attendance-register-search-max-limit" }}
  - name: ATTENDANCE_REGISTER_SEARCH_MAX_LIMIT
    value: {{ index .Values "attendance-register-search-max-limit" | quote }}
  {{- end }}
  {{- if index .Values "attendance-individual-service-integration-required" }}
  - name: ATTENDANCE_INDIVIDUAL_SERVICE_INTEGRATION_REQUIRED
    value: {{ index .Values "attendance-individual-service-integration-required" | quote }}
  {{- end }}
  {{- if index .Values "attendance-staff-service-integration-required" }}
  - name: ATTENDANCE_STAFF_SERVICE_INTEGRATION_REQUIRED
    value: {{ index .Values "attendance-staff-service-integration-required" | quote }}
  {{- end }}
  {{- if index .Values "attendance-document-id-verification-required" }}
  - name: ATTENDANCE_DOCUMENT_ID_VERIFICATION_REQUIRED
    value: {{ index .Values "attendance-document-id-verification-required" | quote }}
  {{- end }}
  {{- if index .Values "organisation-contact-details-update-topic" }}
  - name: ORGANISATION_CONTACT_DETAILS_UPDATE_TOPIC
    value: {{ index .Values "organisation-contact-details-update-topic" | quote }}
  {{- end }}
  {{- if index .Values "contracts-revision-topic" }}
  - name: CONTRACTS_REVISION_TOPIC
    value: {{ index .Values "contracts-revision-topic" | quote }}
  {{- end }}
  - name: EGOV_WORKFLOW_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-workflow-v2
  {{- if index .Values "musterroll-workflow-business-service" }}
  - name: MUSTERROLL_WORKFLOW_BUSINESS_SERVICE
    value: {{ index .Values "musterroll-workflow-business-service" | quote }}
  {{- end }}
  - name: ATTENDANCE_KAFKA_TENANT_ID_PATTERN
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: kafka-tenant-id-pattern
  - name: ATTENDANCE_LOG_KAFKA_CONSUMER_BULK_CREATE_TOPIC
    value: {{ index .Values "attendance-log-kafka-bulk-create-topic" | quote }}
  - name: ATTENDANCE_LOG_KAFKA_CONSUMER_BULK_UPDATE_TOPIC
    value: {{ index .Values "attendance-log-kafka-bulk-update-topic" | quote }}
  - name: ATTENDANCE_REGISTER_KAFKA_MUSTER_STATUS_UPDATE_TOPIC
    value: {{ index .Values "attendance-register-kafka-muster-status-update-topic" | quote }}
# Common Labels
labels:
  app: "transformer"
  group: "health"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "transformer"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: false
    schemaTable: "transformer_schema"
    image:
      repository: "transformer-db"

# Container Configs
image:
  repository: "transformer"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/transformer/health"
  readinessProbePath: "/transformer/health"
appType: "java-spring"
tracing-enabled: true
kafka-mdc-enabled: "true"
heap: "-Xmx1024m -Xms1024m"
java-args: ""
memory_limits: "1Gi"
save-project-task-topic: "save-project-task-topic"
update-project-task-topic: "update-project-task-topic"
transformer-producer-bulk-project-task-index-v1-topic: "transformer-producer-bulk-project-task-index-v1-topic"

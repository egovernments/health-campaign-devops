# Common Labels
labels:
  app: "referralmanagement"
  group: "health"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "referralmanagement"

# Init Containers Configs
initContainers:
  dbMigration:
    enabled: true
    schemaTable: "referralmanagement_schema"
    image:
      repository: "referralmanagement-db"

# Container Configs
image:
  repository: "referralmanagement"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/referralmanagement/health"
  readinessProbePath: "/referralmanagement/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx192m -Xms192m"
java-args: ""
persist-yml-path: "file:///work-dir/health-campaign-config/egov-persister/referral-management-persister.yml"
indexer-yml-path: "file:///work-dir/health-campaign-config/egov-indexer/referral-management-indexer.yml"

kafka-consumer-group-id: health-referral-management
referralmanagement-sideeffect-kafka-create-topic: save-side-effect-topic
referralmanagement-sideeffect-kafka-update-topic: update-side-effect-topic
referralmanagement-sideeffect-kafka-delete-topic: delete-side-effect-topic
referralmanagement-sideeffect-consumer-bulk-create-topic: save-side-effect-bulk-topic
referralmanagement-sideeffect-consumer-bulk-update-topic: update-side-effect-bulk-topic
referralmanagement-sideeffect-consumer-bulk-delete-topic: delete-side-effect-bulk-topic
referralmanagement-referral-kafka-create-topic: save-referral-topic
referralmanagement-referral-kafka-update-topic: update-referral-topic
referralmanagement-referral-kafka-delete-topic: delete-referral-topic
referralmanagement-referral-consumer-bulk-create-topic: save-referral-bulk-topic
referralmanagement-referral-consumer-bulk-update-topic: update-referral-bulk-topic
referralmanagement-referral-consumer-bulk-delete-topic: delete-referral-bulk-topic
referralmanagement-hfreferral-consumer-bulk-create-topic: save-hfreferral-bulk-topic
referralmanagement-hfreferral-consumer-bulk-update-topic: update-hfreferral-bulk-topic
referralmanagement-hfreferral-consumer-bulk-delete-topic: delete-hfreferral-bulk-topic

# Additional Container Envs
env: |
  - name: SPRING_KAFKA_CONSUMER_GROUP_ID
    value: {{ index .Values "kafka-consumer-group-id" | quote }}
  - name: SPRING_KAFKA_PRODUCER_KEY_SERIALIZER
    value: org.apache.kafka.common.serialization.StringSerializer
  {{- if index .Values "global" "tracer-errors-provideexceptionindetails" }}
  - name: TRACER_ERRORS_PROVIDEEXCEPTIONINDETAILS
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: tracer-errors-provideexceptionindetails
  {{- end }}
  - name: EGOV_IDGEN_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-idgen
  - name: EGOV_IDGEN_PATH
    value: "egov-idgen/id/_generate"
  - name: EGOV_IDGEN_INTEGRATION_ENABLED
    value: "true"
  - name: REFERRALMANAGEMENT.SIDEEFFECT.IDGEN.ID.FORMAT
    value: "referralmanagement.sideeffect.id"
  - name: REFERRALMANAGEMENT.REFERRAL.IDGEN.ID.FORMAT
    value: "referralmanagement.referral.id"
  - name: SPRING_REDIS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: redis-host
  - name: SPRING_REDIS_PORT
    value: "6379"
  - name: SPRING_CACHE_TYPE
    value: "redis"
  - name: SPRING_CACHE_REDIS_TIME-TO-LIVE
    value: "60"
  - name: SPRING_CACHE_AUTOEXPIRY
    value: "true"
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SECURITY_BASIC_ENABLED
    value: "false"
  - name: EGOV_USER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-user-egov
  - name: EGOV_SEARCH_USER_URL
    value: "/user/_search"
  - name: EGOV_USER_INTEGRATION_ENABLED
    value: "true"
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  - name: EGOV_LOCATION_HOST
    value: ""
  - name: EGOV_BOUNDARY_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: boundary-service
  - name: EGOV_BOUNDARY_SEARCH_URL
    value: "/boundary-service/boundary/_search"
  - name: EGOV_BOUNDARY_HIERARCHY_NAME
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: boundary-hierarchy
  - name: EGOV_LOCATION_CONTEXT_PATH
    value: "/egov-location/location/v11"
  - name: EGOV_LOCATION_ENDPOINT
    value: "/boundarys/_search"
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: mdms-v2
  - name: EGOV_MDMS_SEARCH_ENDPOINT
    value: "/mdms-v2/v1/_search"
  - name: EGOV_MDMS_PATH
    value: "/mdms-v2/v1/_search"
  - name: MDMS_PATH
    value: "/mdms-v2/v1/_search"
  - name: EGOV_MDMS_INTEGRATION_ENABLED
    value: "true"
  - name: EGOV_MDMS_MASTER_NAME
    value: "referralmanagement_master"
  - name: EGOV_MDMS_MODULE_NAME
    value: "referralmanagement"
  - name: EGOV_HOUSEHOLD_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: household
  - name: EGOV_SEARCH_HOUSEHOLD_URL
    value: "/household/v1/_search"
  - name: EGOV_SEARCH_HOUSEHOLD_MEMBER_URL
    value: "/household/member/v1/_search"
  - name: EGOV_INDIVIDUAL_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: individual
  - name: EGOV_SEARCH_INDIVIDUAL_URL
    value: "/individual/v1/_search"
  - name: EGOV_PRODUCT_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: product
  - name: EGOV_SEARCH_PRODUCT_VARIANT_URL
    value: "/product/variant/v1/_search"
  - name: EGOV_PROJECT_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: project
  - name: EGOV_SEARCH_PROJECT_TASK_URL
    value: "/project/task/v1/_search"
  - name: EGOV_SEARCH_PROJECT_BENEFICIARY_URL
    value: "/project/beneficiary/v1/_search"
  - name: EGOV_SEARCH_PROJECT_STAFF_URL
    value: "/project/staff/v1/_search"
  - name: EGOV_SEARCH_PROJECT_URL
    value: "/project/v1/_search"
  - name: REFERRALMANAGEMENT.SIDEEFFECT.KAFKA.CREATE.TOPIC
    value: {{ index .Values "referralmanagement-sideeffect-kafka-create-topic" | quote }}
  - name: REFERRALMANAGEMENT.SIDEEFFECT.KAFKA.UPDATE.TOPIC
    value: {{ index .Values "referralmanagement-sideeffect-kafka-update-topic" | quote }}
  - name: REFERRALMANAGEMENT.SIDEEFFECT.KAFKA.DELETE.TOPIC
    value: {{ index .Values "referralmanagement-sideeffect-kafka-delete-topic" | quote }}
  - name: REFERRALMANAGEMENT.SIDEEFFECT.CONSUMER.BULK.CREATE.TOPIC
    value: {{ index .Values "referralmanagement-sideeffect-consumer-bulk-create-topic" | quote }}
  - name: REFERRALMANAGEMENT.SIDEEFFECT.CONSUMER.BULK.UPDATE.TOPIC
    value: {{ index .Values "referralmanagement-sideeffect-consumer-bulk-update-topic" | quote }}
  - name: REFERRALMANAGEMENT.SIDEEFFECT.CONSUMER.BULK.DELETE.TOPIC
    value: {{ index .Values "referralmanagement-sideeffect-consumer-bulk-delete-topic" | quote }}
  - name: REFERRALMANAGEMENT.REFERRAL.KAFKA.CREATE.TOPIC
    value: {{ index .Values "referralmanagement-referral-kafka-create-topic" | quote }}
  - name: REFERRALMANAGEMENT.REFERRAL.KAFKA.UPDATE.TOPIC
    value: {{ index .Values "referralmanagement-referral-kafka-update-topic" | quote }}
  - name: REFERRALMANAGEMENT.REFERRAL.KAFKA.DELETE.TOPIC
    value: {{ index .Values "referralmanagement-referral-kafka-delete-topic" | quote }}
  - name: REFERRALMANAGEMENT.REFERRAL.CONSUMER.BULK.CREATE.TOPIC
    value: {{ index .Values "referralmanagement-referral-consumer-bulk-create-topic" | quote }}
  - name: REFERRALMANAGEMENT.REFERRAL.CONSUMER.BULK.UPDATE.TOPIC
    value: {{ index .Values "referralmanagement-referral-consumer-bulk-update-topic" | quote }}
  - name: REFERRALMANAGEMENT.REFERRAL.CONSUMER.BULK.DELETE.TOPIC
    value: {{ index .Values "referralmanagement-referral-consumer-bulk-delete-topic" | quote }}
  - name: REFERRALMANAGEMENT.HFREFERRAL.CONSUMER.BULK.CREATE.TOPIC
    value: {{ index .Values "referralmanagement-hfreferral-consumer-bulk-create-topic" | quote }}
  - name: REFERRALMANAGEMENT.HFREFERRAL.CONSUMER.BULK.UPDATE.TOPIC
    value: {{ index .Values "referralmanagement-hfreferral-consumer-bulk-update-topic" | quote }}
  - name: REFERRALMANAGEMENT.HFREFERRAL.CONSUMER.BULK.DELETE.TOPIC
    value: {{ index .Values "referralmanagement-hfreferral-consumer-bulk-delete-topic" | quote }}
  - name: SEARCH_API_LIMIT
    value: "1000"
  - name: REFERRALMANAGEMENT.DOCUMENT.ID.VERIFICATION.REQUIRED
    value: "false"
  - name: REFERRALMANAGEMENT.DEFAULT.OFFSET
    value: "0"
  - name: REFERRALMANAGEMENT.DEFAULT.LIMIT
    value: "100"
  - name: REFERRALMANAGEMENT.SEARCH.MAX.LIMIT
    value: "200"
  - name: EGOV.HF.REFERRAL.SEARCH.BATCH.SIZE
    value: "200"
  - name: EGOV.IDGEN.PROJECT.NUMBER.NAME
    value: "project.number"
  - name: PROJECT.RESOURCE.IDGEN.ID.FORMAT
    value: "project.resource.id"
  - name: EGOV_FACILITY_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: facility
  - name: EGOV_SEARCH_FACILITY_URL
    value: "/facility/v1/_search"
  - name: EGOV_SEARCH_PROJECT_FACILITY_URL
    value: "/project/facility/v1/_search"
  - name: PROJECT_MDMS_MODULE
    value: "HCM-PROJECT-TYPES"
  - name: EGOV_LOCATION_HIERARCHY_TYPE
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: boundary-hierarchy
  - name: EGOV_LOCATION_CODE_QUERY_PARAM
    value: "code"
  - name: EGOV_ENABLE_MATVIEW_SEARCH
    value: "true"
  # S3 Configuration for file storage and presigned URLs
  - name: EGOV_S3_BUCKET
    value: {{ index .Values "egov-s3-bucket" | quote }}
  - name: EGOV_S3_REGION
    value: {{ index .Values "egov-s3-region" | quote }}
  - name: EGOV_S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: egov-s3
        key: access-key
  - name: EGOV_S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: egov-s3
        key: secret-key
  - name: EGOV_S3_ENDPOINT
    value: {{ index .Values "egov-s3-endpoint" | quote }}
  # CRITICAL: This controls the URL used in presigned S3 URLs
  # Without this, the application returns localhost:9000 URLs
  - name: EGOV_S3_PRESIGN_ENDPOINT
    value: {{ index .Values "egov-s3-presign-endpoint" | quote }}

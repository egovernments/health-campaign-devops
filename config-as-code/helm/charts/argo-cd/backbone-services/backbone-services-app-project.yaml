apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: backbone-services-project
  namespace: argocd
spec:
  sourceRepos:
    - git@github.com:egovernments/health-campaign-devops.git

  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc

  # cert-manager ships CRDs, ClusterIssuers and webhooks, ingress-nginx an
  # IngressClass, and elasticsearch binds static PersistentVolumes.
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

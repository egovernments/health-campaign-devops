apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-operator
  namespace: argocd
spec:
  # CloudNativePG operator; dhis2's Postgres is a cnpg Cluster, so this must
  # be synced before the dhis2 Application. hcm-demo runs the same chart
  # version with default values (helm release "cnpg" in cnpg-system).
  project: default

  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.29.0
    helm:
      releaseName: cnpg

  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system

  # The operator injects its own caBundle, and AKS's admissions enforcer adds
  # namespaceSelector terms to webhooks; both would otherwise loop self-heal.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
        - .webhooks[]?.namespaceSelector
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
        - .webhooks[]?.namespaceSelector

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      # The cnpg CRDs exceed the client-side apply annotation size limit.
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s

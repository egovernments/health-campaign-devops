apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: who-afro-egov-appset-frontend
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: digit-ui
          - name: workbench-ui

  template:
    metadata:
      name: 'egov-{{name}}'

    spec:
      project: egov-project

      source:
        repoURL: git@github.com:egovernments/health-campaign-devops.git
        targetRevision: azure-install-who-test
        path: config-as-code/helm/charts/frontend/{{name}}
        helm:
          valueFiles:
            - values.yaml
            - ../../../../environments/who-afro-hcm.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: egov

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

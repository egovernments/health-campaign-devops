apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: who-afro-chad-appset-health
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - name: project-factory
          - name: transformer
          - name: resource-generator
          - name: plan-service
          - name: excel-ingestion
          - name: census-service
          - name: auth-proxy
          - name: health-expense-calculator

  template:
    metadata:
      name: 'chad-{{name}}'

    spec:
      project: chad-project

      source:
        repoURL: git@github.com:HCM-WHO-AFRO/health-campaign-devops.git
        targetRevision: azure-install-who-test
        path: config-as-code/helm/charts/health-services/{{name}}
        helm:
          valueFiles:
            - values.yaml
            - ../../../../environments/chad-afro-hcm.yaml

      destination:
        server: https://kubernetes.default.svc
        namespace: '*'

      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas

      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - ApplyOutOfSyncOnly=true
          - ServerSideApply=true
        retry:
          limit: 10
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m0s

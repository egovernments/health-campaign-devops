apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clamav-security
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: git@github.com:egovernments/health-campaign-devops.git
    targetRevision: azure-install-who-test
    path: config-as-code/helm/charts/security/clamav
    helm:
      valueFiles:
        - values.yaml
        - ../../../../environments/clamav-security.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: security

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s

  revisionHistoryLimit: 10
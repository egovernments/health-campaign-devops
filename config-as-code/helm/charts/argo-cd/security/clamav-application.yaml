apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clamav-security
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  # hcm-demo runs the upstream wiremind chart (helm release "clamav"), not
  # helm/charts/security/clamav, so v2 uses the same chart and values.
  sources:
    - repoURL: https://wiremind.github.io/wiremind-helm-charts
      chart: clamav
      targetRevision: 3.7.1
      helm:
        releaseName: clamav
        valueFiles:
          - $values/config-as-code/environments/clamav-hcm-demo-v2.yaml
    - repoURL: git@github.com:egovernments/health-campaign-devops.git
      targetRevision: azure-install-hcm-demo-v2
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: security

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 10
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m0s

  revisionHistoryLimit: 10

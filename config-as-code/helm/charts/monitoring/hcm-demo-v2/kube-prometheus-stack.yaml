# Values for the kube-prometheus-stack release, taken from the live hcm-demo release
# (`helm get values kube-prometheus-stack -n monitoring`) and adapted for hcm-demo-v2.
# Alertmanager is disabled on v2 for now. Its config (Slack webhook, SMTP
# password) is left out of this file; hcm-demo's lives in the chart release.
additionalPrometheusRules:
- groups:
  - name: SSLCertificateAlerts
    rules:
    - alert: SSLCertificateExpiring
      expr: probe_ssl_earliest_cert_expiry{job="blackbox", instance="prometheus-blackbox-exporter:9115"} - time() < 2*24*3600
      for: 1m
      labels:
        repeat_interval: 30m
        severity: warning
    - alert: KubernetesContainerOomKiller
      annotations:
        description: |-
          Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
            VALUE = {{ $value }}
            LABELS = {{ $labels }}
        repeat_interval: 30m
        summary: Kubernetes container oom killer ({{ $labels.namespace }}/{{ $labels.pod }}:{{ $labels.container }})
      expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
      for: 1m
      labels:
        severity: warning
    - alert: KubernetesPodNotHealthy
      annotations:
        description: |-
          Pod {{ $labels.namespace }}/{{ $labels.pod }} has been in a non-running state for longer than 15 minutes.
            VALUE = {{ $value }}
            LABELS = {{ $labels }}
        repeat_interval: 30m
        summary: Kubernetes Pod not healthy ({{ $labels.namespace }}/{{ $labels.pod }})
      expr: sum by (namespace, pod) (kube_pod_status_phase{phase=~"Pending|Unknown|Failed"}) > 0
      for: 10m
      labels:
        severity: critical
  name: podalerts
- groups:
  - name: KubernetesNodeNotReady
    rules:
    - alert: KubernetesNodeNotReady
      annotations:
        description: |-
          Node {{ $labels.node }} has been unready for a long time
            VALUE = {{ $value }}
            LABELS = {{ $labels }}
        repeat_interval: 30m
        summary: Kubernetes Node ready (node {{ $labels.node }})
      expr: kube_node_status_condition{condition="Ready",status="true"} == 0
      for: 5m
      labels:
        severity: critical
    - alert: KubernetesNodeMemoryPressure
      annotations:
        description: |-
          Node {{ $labels.node }} has MemoryPressure condition
            VALUE = {{ $value }}
            LABELS = {{ $labels }}
        repeat_interval: 30m
        summary: Kubernetes memory pressure (node {{ $labels.node }})
      expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
      for: 2m
      labels:
        severity: critical
    - alert: KubernetesNodeDiskPressure
      annotations:
        description: |-
          Node {{ $labels.node }} has DiskPressure condition
            VALUE = {{ $value }}
            LABELS = {{ $labels }}
        repeat_interval: 30m
        summary: Kubernetes disk pressure (node {{ $labels.node }})
      expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
      for: 2m
      labels:
        severity: critical
    - alert: KubernetesNodeNetworkUnavailable
      annotations:
        description: |-
          Node {{ $labels.node }} has NetworkUnavailable condition
            VALUE = {{ $value }}
            LABELS = {{ $labels }}
        repeat_interval: 30m
        summary: Kubernetes Node network unavailable (instance {{ $labels.instance }})
      expr: kube_node_status_condition{condition="NetworkUnavailable",status="true"} == 1
      for: 2m
      labels:
        severity: critical
  name: nodealerts
- groups:
  - name: KubernetesPersistentvolume
    rules:
    - alert: KubernetesVolumeOutOfDiskSpace
      annotations:
        description: |-
          Volume is almost full (< 10% left)
            VALUE = {{ $value }}
            LABELS = {{ $labels }}
        repeat_interval: 30m
        summary: Kubernetes Volume out of disk space (instance {{ $labels.instance }})
      expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes * 100 < 10
      for: 2m
      labels:
        severity: warning
    - alert: KubernetesVolumeFullInFourDays
      annotations:
        description: |-
          Volume under {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is expected to fill up within four days. Currently {{ $value | humanize }}% is available.
            VALUE = {{ $value }}
            LABELS = {{ $labels }}
        repeat_interval: 30m
        summary: Kubernetes Volume full in four days (instance {{ $labels.instance }})
      expr: predict_linear(kubelet_volume_stats_available_bytes[6h:5m], 4 * 24 * 3600) < 0
      for: 1m
      labels:
        severity: critical
    - alert: KubernetesPersistentvolumeError
      annotations:
        description: |-
          Persistent volume {{ $labels.persistentvolume }} is in bad state
            VALUE = {{ $value }}
            LABELS = {{ $labels }}
        repeat_interval: 30m
        summary: Kubernetes PersistentVolumeClaim pending ({{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }})
      expr: kube_persistentvolume_status_phase{phase=~"Failed|Pending", job="kube-state-metrics"} > 0
      for: 1m
      labels:
        severity: critical
    - alert: PVCStorageLow
      annotations:
        description: The PVC storage usage has exceeded 85%. Current usage is {{ $value }}%.
        summary: PVC storage usage is above 85%
      expr: (kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes) * 100 < 15
      for: 5m
      labels:
        severity: warning
  name: volumealerts

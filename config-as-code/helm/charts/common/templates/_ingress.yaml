{{- define "common.ingress" -}}
{{- if .Values.ingress.enabled -}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ default (include "common.name" .) .Values.ingress.name }}
  namespace: {{ .Values.ingress.namespace | default .Values.namespace }}
  annotations:
    gateway-keyResolver: "@ipKeyResolver"
    gateway-burstCapacity: "20"
    gateway-replenishRate: "10"
  {{- if and .Values.ingress .Values.ingress.rewriteEnable }}
    nginx.ingress.kubernetes.io/rewrite-target: /{{ .Values.ingress.rewritePath }}$2
    nginx.ingress.kubernetes.io/use-regex: "true"
  {{- end }}
  {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.ingress.waf.enabled }}
    {{- toYaml .Values.ingress.waf.annotations | nindent 4 }}
  {{- end }}
  {{- if .Values.ingress.additionalAnnotations }}
    {{- tpl .Values.ingress.additionalAnnotations . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
spec:
  ingressClassName: nginx
  rules:
  {{- if .Values.ingress.zuul }}
    {{- if .Values.global.hosts }}
      {{- $hosts := .Values.global.hosts }}
      {{- $exclude := .Values.hostExclude | default (list) }}
      {{- $filtered := $hosts }}
      {{- range $exclude }}
        {{- $filtered = without $filtered . }}
      {{- end }}
      {{- range $filtered }}
    - host: {{ . }}
      http:
        paths:
          - path: /{{ $.Values.ingress.context }}{{ if and $.Values.ingress $.Values.ingress.rewriteEnable }}(/|$)(.*){{ end }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ $.Values.ingress.gatewayService | default "gateway" }}
                port:
                  number: {{ $.Values.ingress.gatewayServicePort | default 8080 }}
      {{- end }}
    {{- else }}
    - host: {{ .Values.global.domain | default "example.com" }}
      http:
        paths:
          - path: /{{ .Values.ingress.context }}{{ if and .Values.ingress .Values.ingress.rewriteEnable }}(/|$)(.*){{ end }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.ingress.gatewayService | default "gateway" }}
                port:
                  number: {{ .Values.ingress.gatewayServicePort | default 8080 }}
    {{- end }}
  {{- else }}
    - host: {{ .Values.global.domain }}
      http:
        paths:
          - path: /{{ .Values.ingress.context }}{{ if and .Values.ingress .Values.ingress.rewriteEnable }}(/|$)(.*){{ end }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ .Values.ingress.serviceName | default .Chart.Name }}
                port:
                  number: {{ .Values.ingress.servicePort | default .Values.httpPort }}
  {{- end }}
  tls:
  {{- if .Values.ingress.zuul }}
    {{- if .Values.global.hosts }}
      {{- $hosts := .Values.global.hosts }}
      {{- $exclude := .Values.hostExclude | default (list) }}
      {{- $filtered := $hosts }}
      {{- range $exclude }}
        {{- $filtered = without $filtered . }}
      {{- end }}
      {{- range $filtered }}
    - secretName: {{ . }}-tls-certs
      hosts:
        - {{ . }}
      {{- end }}
    {{- else }}
    - secretName: {{ .Values.global.domain | default "example.com" }}-tls-certs
      hosts:
        - {{ .Values.global.domain | default "example.com" }}
    {{- end }}
  {{- else }}
  - secretName: {{ .Values.global.domain }}-tls-certs
    hosts:
      - {{ .Values.global.domain }}
  {{- end }}
{{- end }}
{{- end }}

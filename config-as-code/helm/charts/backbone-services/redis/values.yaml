# Default values for egov-finance.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
namespace: backbone 

# Common Labels
labels:
  app: "redis"

# Container Configs
image:
  repository: "redis"
  pullPolicy: IfNotPresent
  tag: "7.2.4"
replicas: "1"
httpPort: 6379

# Resource Configuration for Production
cpu_requests: "500m"
memory_requests: "8Gi"
cpu_limits: "2"
memory_limits: "16Gi"
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dhis2-core-helm.fullname" . }}
  labels:
    {{- include "dhis2-core-helm.labels" . | nindent 4 }}
type: Opaque
data:
  USERNAME: {{ .Values.jobs.authentication.dhis2.username | b64enc }}
  PASSWORD: {{ .Values.jobs.authentication.dhis2.password | b64enc }}
  DB_HOSTNAME: {{ include "dhis2-core-helm.databaseHostname" . | b64enc }}
  DB_DATABASE: {{ include "dhis2-core-helm.databaseName" . | b64enc }}
{{- if .Values.database.existingSecret }}
{{- if not .Values.database.secretKeys.username }}
  DB_USERNAME: {{ include "dhis2-core-helm.databaseUsername" . | b64enc }}
{{- end }}
{{- else }}
  DB_USERNAME: {{ include "dhis2-core-helm.databaseUsername" . | b64enc }}
  DB_PASSWORD: {{ include "dhis2-core-helm.databasePassword" . | b64enc }}
{{- end }}
{{- if eq (include "dhis2-core-helm.storageType" .) "minio" }}
  MINIO_PROVIDER: {{ .Values.minIO.provider | default "" | b64enc }}
  MINIO_CONTAINER: {{ .Values.minIO.container | default "" | b64enc }}
  MINIO_ENDPOINT: {{ include "dhis2-core-helm.minioEndpoint" . | b64enc }}
  MINIO_LOCATION: {{ .Values.minIO.location | default "" | b64enc }}
  MINIO_IDENTITY: {{ .Values.minIO.identity | default "" | b64enc }}
  MINIO_SECRET: {{ .Values.minIO.secret | default "" | b64enc }}
{{- end }}
{{- if eq (include "dhis2-core-helm.storageType" .) "s3" }}
  S3_PROVIDER: {{ .Values.S3.provider | default "" | b64enc }}
  S3_CONTAINER: {{ .Values.S3.container | default "" | b64enc }}
  S3_ENDPOINT: {{ .Values.S3.endpoint | default "" | b64enc }}
  S3_LOCATION: {{ .Values.S3.location | default "" | b64enc }}
  S3_IDENTITY: {{ .Values.S3.identity | default "" | b64enc }}
  S3_SECRET: {{ .Values.S3.secret | default "" | b64enc }}
{{- end }}
{{- if .Values.doris.enabled }}
  DORIS_HOSTNAME: {{ include "dhis2-core-helm.dorisHostname" . | b64enc }}
  DORIS_PORT: {{ .Values.doris.port | toString | b64enc }}
  DORIS_DATABASE: {{ .Values.doris.database | b64enc }}
  DORIS_USE_SSL: {{ .Values.doris.useSSL | toString | b64enc }}
{{- if not .Values.doris.existingSecret }}
  DORIS_USERNAME: {{ required "doris.username is required when doris.enabled is true" .Values.doris.username | b64enc }}
  DORIS_PASSWORD: {{ required "doris.password is required when doris.enabled is true" .Values.doris.password | b64enc }}
{{- end }}
{{- end }}
{{- if .Values.googleAuth.projectId }}
  dhis-google-auth.json: |
    {{ dict
      "type" "service_account"
      "project_id" .Values.googleAuth.projectId
      "private_key_id" .Values.googleAuth.privateKeyId
      "private_key" (.Values.googleAuth.privateKey | replace "\\n" "\n")
      "client_email" .Values.googleAuth.clientEmail
      "client_id" .Values.googleAuth.clientId
      "auth_uri" "https://accounts.google.com/o/oauth2/auth"
      "token_uri" "https://oauth2.googleapis.com/token"
      "auth_provider_x509_cert_url" "https://www.googleapis.com/oauth2/v1/certs"
      "client_x509_cert_url" "https://www.googleapis.com/robot/v1/metadata/x509/dhis2-demo%40dhis2-gis.iam.gserviceaccount.com"
      | toJson | b64enc | nindent 4 }}
{{- end }}

# This file contains default configuration settings for deploying a DHIS 2 instance using Helm charts.
# This chart bundles a CloudNativePG PostgreSQL cluster and an optional Bitnami MinIO file store and
# wires them up itself: database.hostname resolves to the cluster's read-write service, the MinIO
# endpoint resolves to the MinIO subchart's service, and database credentials are set once under
# global.postgresql.auth where the cluster's bootstrap and DHIS 2's connection settings pick them
# up. The file store is selected with storage.type; "minio" also requires minio.enabled=true.
# The CloudNativePG operator must be installed on the cluster before this chart can deploy.

global:
  security:
    # -- Required for the bitnamilegacy minio image repository configured below.
    allowInsecureImages: true
  postgresql:
    auth:
      # -- Database username shared by the PostgreSQL cluster bootstrap and DHIS 2's connection settings.
      username: dhis
      # -- Database password shared by the PostgreSQL cluster secrets and DHIS 2's connection settings.
      password: dhis
      # -- Database name shared by the PostgreSQL cluster bootstrap and DHIS 2's connection settings.
      database: dhis2

postgresql:
  # -- Deploy a CloudNativePG PostgreSQL cluster. Requires the CloudNativePG operator; disable to bring your own database and set database.hostname.
  enabled: true
  # -- Number of PostgreSQL instances (pods) in the cluster.
  instances: 1
  # -- PostGIS-enabled operand image; DHIS 2 requires the postgis extension.
  imageName: ghcr.io/cloudnative-pg/postgis:17-3.5
  # -- Storage size of each instance.
  storageSize: 8Gi
  # -- Storage class for the instance volumes; empty uses the cluster default.
  storageClass: ""
  # -- Labels propagated by the operator to every object it creates, including pods.
  commonLabels: {}
  # -- Resources of the PostgreSQL containers.
  resources: {}
  seed:
    # -- Run a one-time seed job once the database is ready. The job waits for the database, skips if the dhis2_chart_seed_complete marker table exists, runs the script with superuser PG* environment prepared, then creates the marker. DHIS 2 waits for the marker before starting.
    enabled: false
    # -- Image for the seed job and the wait-for-seed init container; needs psql and curl.
    image: dhis2/postgresql-curl:17
    # -- Shell script performing the seed.
    script: ""
    # -- Extra environment variables for the seed job.
    extraEnv: []

minio:
  # -- Deploy the MinIO subchart. Enable together with storage.type=minio.
  enabled: false
  auth:
    # -- MinIO access key, must match minIO.identity.
    rootUser: dhisdhis
    # -- MinIO secret key, must match minIO.secret.
    rootPassword: dhisdhis
  # -- Bucket created on startup, must match minIO.container.
  defaultBuckets: dhis2
  # -- The Bitnami default preset starves the file store under load; no preset is applied and explicit resources should be set instead.
  resourcesPreset: none
  image:
    # -- Bitnami stopped publishing versioned minio images to the bitnami repository; the legacy repository carries them (requires global.security.allowInsecureImages).
    repository: bitnamilegacy/minio

# -- Common labels applied to all Kubernetes resources created by this chart.
commonLabels: {}

# Doris analytics database connection. Points at a shared Doris cluster, with each instance using its own database.
doris:
  # -- Whether to use Doris as the analytics database.
  enabled: false
  # -- Hostname of the Doris frontend (MySQL protocol).
  hostname: ""
  port: 9030
  useSSL: false
  # -- Name of the Doris database for this instance.
  database: ""
  # -- Create the database and user on install and drop the database on uninstall. Provisioning connects as passwordless root, intended for the bundled dorisCluster below; for a shared Doris cluster set this to false and provide pre-provisioned credentials via existingSecret.
  createDatabase: true
  # -- Doris username for DHIS 2, created with the required grants by the create-database job when createDatabase is true. Ignored when existingSecret is set.
  username: ""
  # -- Doris password. Required when doris.enabled is true unless existingSecret is set.
  password: ""
  # -- Existing secret with the Doris credentials.
  existingSecret: ""
  secretKeys:
    username: username
    password: password
  # -- PostgreSQL JDBC driver for the Doris JDBC catalog DHIS 2 creates on startup. For production, prefer a driver pre-installed in the Doris image's jdbc_drivers directory and set a bare filename (e.g. postgresql.jar); the URL default makes Doris download the driver from the internet at runtime, which fails in air-gapped clusters.
  driverFilename: https://jdbc.postgresql.org/download/postgresql-42.7.7.jar

# Bundled Apache Doris cluster deployed next to this chart, as an alternative to the shared cluster
# doris.hostname points at. Requires the doris-operator to be installed on the cluster. When
# enabled, an empty doris.hostname resolves to the bundled cluster's frontend service.
# See https://artifacthub.io/packages/helm/doris/doris for all options.
dorisCluster:
  enabled: false
  dorisCluster:
    # -- Name of the DorisCluster resource, must be unique per namespace.
    name: dhis2-doris
  # The upstream defaults request 8 CPU / 16Gi per component, which does not schedule on typical
  # nodes; these are sized for a self-contained deployment, raise them for production workloads.
  # Note: the upstream chart uses the singular `resource` key.
  feSpec:
    replicas: 1
    resource:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 8Gi
  beSpec:
    replicas: 1
    resource:
      requests:
        cpu: "1"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 8Gi

glowroot:
  # -- Whether to enable Glowroot or not.
  enabled: false
  # -- Glowroot port
  port: 4000
  # -- Glowroot version
  version: 0.14.2
  # -- Glowroot expected sha
  expectedSha: 7c7a46d8f0d020962f9299eb3c809a49d3156afb4ded46fae9088a603bc66fa3
  # -- Glowroot init container image
  image: alpine:latest
  ingress:
    # -- Enable Glowroot ingress
    enabled: true
    # -- Glowroot ingress path
    path: /glowroot
  # -- Glowroot configuration
  config:
    general:
      agentDisplayName: "DHIS2"
    web:
      bindAddress: "0.0.0.0"
      port: 4000
      contextPath: /glowroot
    ui:
      defaultTransactionType: "Web"
      defaultPercentiles: [50.0, 95.0, 99.0, 99.9]
      defaultGaugeNames: []
    gauges:
      - mbeanObjectName: "java.lang:type=Memory"
        mbeanAttributes:
          - name: "HeapMemoryUsage.used"
          - name: "NonHeapMemoryUsage.used"

jobs:
  authentication:
    dhis2:
      # -- Default DHIS2 username.
      username: admin
      # -- Default DHIS2 username.
      password: district
  generateAnalytics:
    # -- Whether the "Generate Analytics" job is enabled.
    enabled: false
  enableUsers:
    # -- Whether the "Enable Users" job is enabled.
    enabled: false
    # -- List of users to target. Support multiple users by adding a comma-separated list of usernames.
    targetUser: alinana,arabiceB
  installApps:
    # -- Whether the "Install Apps" job is enabled.
    enabled: false
    # -- List of applications to install/update
    apps:
      - name: Capture
        version: latest # A specific version such as "103.2.4" can also be used
      - name: Dashboard
        version: latest
#      - name: Microplanning
#        version: latest

# Configuration related to Google Auth (optional).
googleAuth:
  # -- The unique ID of the Google Cloud Project.
  projectId: ""
  # -- The private key ID used for authentication.
  privateKeyId: ""
  # -- The private key in PEM format. Use single quotes if it contains \n or other special characters.
  privateKey: ''
  # -- The email address of the service account.
  clientEmail: ""
  # -- The OAuth 2.0 Client ID.
  clientId: ""

# Database connection settings. Username, password and database fall back to the global.postgresql.auth values above, so credentials are configured once for both the PostgreSQL subchart and DHIS 2.
database:
  # -- Existing secret containing database credentials
  existingSecret: ""
  secretKeys:
    # -- Optional: Key for username in the secret. If empty, uses the plain username value
    username: username
    # -- Key for password in the secret
    password: password
  # -- Default database username.
  username: dhis
  # -- Default database password.
  password: dhis
  # -- Name of the database to use.
  database: dhis2
  # -- Hostname or IP address of the PostgreSQL server. When empty, resolves to <release>-postgresql, the service of the bundled PostgreSQL subchart.
  hostname: ""

# Configuration for session cookies.
# -- Value can be 'Lax', 'Strict', or 'None'.
sessionCookieSameSite: Lax

# Flyway migrations
flyway:
  # -- Allow out-of-order migrations
  migrateOutOfOrder: false
  # -- Repair before migrations
  repairBeforeMigration: false

# -- Enable SQL query logging
enableQueryLogging: false

# -- Custom configuration snippet (optional).
#customConfigSnippet: |
#  custom = property

# File store configuration. When the type is "minio" or "s3", volumeSize/className are ignored and no pvc is created.
storage:
  # -- File store type: "filesystem", "minio" or "s3". When "minio", also set minio.enabled=true above.
  type: filesystem
  # -- Size of the Persistent Volume Claim, e.g., 8Gi for 8 gigabytes.
  volumeSize: 8Gi
  # -- Name of the storage class. It's recommended to update this to a storage class which exists on your cluster. Such as "gp2" on AWS.
  className: ~

# MinIO file store connection settings, only used when storage.type is "minio".
minIO:
  # -- Provider type, currently only 's3' is supported.
  provider: s3
  # -- Bucket name in the storage service, must match minio.defaultBuckets.
  container: dhis2
  # -- Endpoint URL for the MinIO server. When empty, resolves to http://<release>-minio:9000, the service of the bundled MinIO subchart.
  endpoint: ""
  # -- AWS region or custom location identifier.
  location: eu-west-1
  # -- Access key, must match minio.auth.rootUser.
  identity: dhisdhis
  # -- Secret key, must match minio.auth.rootPassword.
  secret: dhisdhis

#S3:
#  # -- Provider type, currently only 'aws-s3' is supported.
#  provider: aws-s3
#  # -- Container name in the storage service.
#  container: dhis2
#  # -- Optional endpoint override (for S3-compatible services). Leave empty for real AWS S3.
#  endpoint: ""
#  # -- AWS region or custom location identifier.
#  location: eu-west-1
#  # -- Access key ID or similar credential.
#  identity: dhisdhis
#  # -- Secret access key.
#  secret: dhisdhis

# -- Init containers.
initContainers: []
# - name: custom-init
#   image: busybox
#   command: ['sh', '-c', 'echo custom init container']
#   volumeMounts:
#    - name: dhis-home
#      mountPath: /dhis-home

# -- DHIS 2 home directory.
dhis2Home: /opt/dhis2

# -- Temporary directory for Java (used when readOnlyRootFilesystem is true).
javaTempDir: /tmp/dhis

# -- Path to the log4j2 configuration file. Set to `config/log4j2-json.xml` for structured JSON logging suitable for log aggregators like Loki.
log4j2: config/log4j2.xml

# -- Path to the Tomcat server XML configuration file.
serverXml: config/server.xml

# -- Options passed to Java and Tomcat startup scripts.
# -- Additional options for JVM.catalinaOpts: "-Dcontext.path='' -Dcontext.sameSiteCookies='lax'"
javaOpts: ""

# -- Context path settings for Embedded Tomcat
contextPath: /

# -- Minimum number of seconds for the pod to be ready before being considered available.
minReadySeconds: 120
startupProbe: # 2min10s (26 * 5 = 130s)
  # -- Maximum number of failures.
  failureThreshold: 26
  # -- Period between each try
  periodSeconds: 5
  # -- Path
  path: /
livenessProbe:
  # -- Timeout in seconds
  timeoutSeconds: 1
  # -- Path
  path: /
readinessProbe:
  # -- Timeout in seconds
  timeoutSeconds: 1
  # -- Path
  path: /

# -- Number of replicas (instances) of DHIS 2 to run.
replicaCount: 1

strategy:
  # -- Deployment strategy for rolling updates.
  type: RollingUpdate
  rollingUpdate:
    # -- Maximum surge
    maxSurge: 1
    # -- Maximum unavailable
    maxUnavailable: 0

image:
  # -- Docker image repository name.
  repository: dhis2/core
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Overrides the image tag whose default is the chart appVersion.
  tag: 2.42

# -- List of secrets to use for pulling images from private registries.
imagePullSecrets: []

# -- Overrides the chart's default name.
nameOverride: ""
# -- Overrides the full name of the deployment (including namespace).
fullnameOverride: ""

serviceAccount:
  # -- Whether a service account should be created.
  create: true
  # -- Additional annotations for the service account.
  annotations: {}
  # -- Name of an existing service account to use. If not set and create is true, a name is generated using the fullname template
  name: ""

# -- Annotations applied to all pods deployed by this chart.
podAnnotations: {}

# -- Labels applied to all pods deployed by this chart.
podLabels: {}

# -- Security context settings for pods (e.g., fsGroup).
podSecurityContext: {}

# -- Don't change anything here unless you really know what you are doing
securityContext:
  # -- Whether to allow privilege escalation
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # -- Whether to use a read-only root filesystem
  readOnlyRootFilesystem: true
  # -- Enforce application running as a non-privileged user
  runAsNonRoot: true
  # -- 65534 is commonly used as a non-root user, and it corresponds to the nobody user in the distroless image which is used for DHIS2 builds after 2.42. Before 2.42, the user id 65532 is used
  runAsUser: 65534
  # -- See `securityContext.runAsUser`
  runAsGroup: 65534

# Service configuration.
service:
  # -- Service type
  type: ClusterIP
  # -- Service port
  port: 8080
  # -- Additional annotations for the service
  annotations: {}

ingress:
  # -- Whether to enable ingress or not.
  enabled: true
  # -- Class name
  className: nginx
  # -- Hostname
  hostname: dhis2-core.127.0.0.1.nip.io
  # -- Path (should start with /)
  path: /
  # -- Name of certification issuer
  # certIssuer: letsencrypt-staging | letsencrypt-prod
  # -- Annotations which should be applied to the ingress resource
  annotations: {}
  # kubernetes.io/ingress.class: nginx
  # kubernetes.io/tls-acme: "true"

# KEDA is a Kubernetes-based Event Driven Autoscaling component
# Only support Nginx ingress controller... Service type: ExternalName
keda:
  # -- Whether to enable KEDA scaling or not.
  enabled: false
  replicas:
    # -- Minimum number of replicas
    min: 0
    # -- Maximum number of replicas
    max: 1
  # -- The delay before the cooldownPeriod starts after the initial creation
  initialCooldownPeriod: 3600
  # -- The delay before scaling down, starts after the last scaling event
  scaledownPeriod: 600
  # -- KEDA HTTP interceptor proxy hostname
  proxy:
    hostname: keda-add-ons-http-interceptor-proxy.keda.svc
  scalingMetric:
    requestRate:
      granularity: 1s
      targetValue: 5
      window: 30s

# -- Resource requests and limits for containers.
resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  # -- Whether horizontal pod autoscaler is enabled.
  enabled: false
  # -- Minimum number of replicas for the deployment.
  minReplicas: 1
  # -- Maximum number of replicas for the deployment.
  maxReplicas: 100
  # -- Target CPU utilization percentage to scale based on.
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# -- Node selector labels that allow pods to be scheduled only onto nodes matching these labels.
nodeSelector: {}

# -- Tolerations that are added to pods to allow them to schedule onto nodes with certain taints.
tolerations: []

# -- Affinity rules for pod scheduling, allowing you to define preferred or required co-location of pods.
affinity: {}

{{- /*
Opaque secrets that have no dedicated template, listed in the SOPS file as
cluster-configs.secrets.generic: [{name, namespace, data: {key: value}}].
*/}}
{{- range $s := (index .Values "cluster-configs" "secrets" "generic") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $s.name }}
  namespace: {{ $s.namespace }}
type: Opaque
data:
  {{- range $k, $v := $s.data }}
  {{ $k }}: {{ $v | b64enc | quote }}
  {{- end }}
{{- end }}

{{- with index .Values "cluster-configs" "secrets" "grafana" }}
{{- if index . "clientSecret" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
type: Opaque
data:
  GF_AUTH_GITHUB_CLIENT_ID: {{ .clientID | b64enc | quote }}
  GF_AUTH_GITHUB_CLIENT_SECRET: {{ .clientSecret | b64enc | quote }}
{{- end }}
{{- end }}

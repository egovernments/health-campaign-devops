{{- with index .Values "cluster-configs" "secrets" "grafana-admin" }}
{{- if index . "admin-password" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
type: Opaque
data:
  admin-user: {{ index . "admin-user" | b64enc | quote }}
  admin-password: {{ index . "admin-password" | b64enc | quote }}
{{- end }}
{{- end }}

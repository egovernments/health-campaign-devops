# Common Labels
labels:
  app: "inbox"
  group: "rainmaker"

# Ingress Configs
ingress:
  enabled: true
  zuul: true
  context: "inbox"

# Container Configs
image:
  repository: "inbox"
replicas: "1"
healthChecks:
  enabled: true
  livenessProbePath: "/inbox/health"
  readinessProbePath: "/inbox/health"
appType: "java-spring"
tracing-enabled: true
heap: "-Xmx256m -Xms256m"
java-args: "-Dspring.profiles.active=monitoring"
dashboard-analytics-host: "dashboard-analytics"
egov-internal-microservice-user-uuid: "egov-internal-microservice-user-uuid"

# Additional Container Envs
env: |
  - name: WORKFLOW_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-workflow-v2
  - name: WORKFLOW_PROCESS_SEARCH_PATH
    value: "egov-workflow-v2/egov-wf/process/_search"
  - name: WORKFLOW_BUSINESSSERVICE_SEARCH_PATH
    value: "egov-workflow-v2/egov-wf/businessservice/_search"
  - name: WORKFLOW_PROCESS_COUNT_PATH
    value: "egov-workflow-v2/egov-wf/process/_count"
  - name: WORKFLOW_PROCESS_STATUSCOUNT_PATH
    value: "egov-workflow-v2/egov-wf/process/_statuscount"
  - name: EGOV_USER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: egov-user
  - name: EGOV_USER_SEARCH_PATH
    value: "user/_search"
  - name: SERVER_SERVLET_CONTEXT_PATH
    value: {{ index .Values "context" | default "/inbox" | quote }} 
  - name: EGOV_DASHBOARD_ANALYTICS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: {{ index .Values "dashboard-analytics-host" | quote }} 
  - name: EGOV_MDMS_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-service-host
        key: mdms-v2
  - name: EGOV_MDMS_SEARCH_ENDPOINT
    value: "/mdms-v2/v1/_search"
  - name: EGOV_MDMS_PATH
    value: "/mdms-v2/v1/_search"
  - name: MDMS_PATH
    value: "/mdms-v2/v1/_search"
  - name: EGOV_INTERNAL_MICROSERVICE_USER_UUID
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: {{ index .Values "egov-internal-microservice-user-uuid" | quote }}
  - name: SERVICES_ESINDEXER_HOST
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: es-indexer-host
  - name: STATE_LEVEL_TENANT_ID
    valueFrom:
      configMapKeyRef:
        name: egov-config
        key: egov-state-level-tenant-id
  - name: SERVICE_SEARCH_MAPPING
    value:  {{ index .Values "service-map" | quote }} 
  - name: JAVA_OPTS
    value: {{ index .Values "heap" | quote }}
  - name: JAVA_ARGS
    value: {{ index .Values "java-args" | quote }}
  - name: SERVER_PORT
    value: "8080"
  - name: SECURITY_BASIC_ENABLED
    value: "false"  
  - name: MANAGEMENT_SECURITY_ENABLED
    value: "false"
  - name: BS_BUSINESSCODE_SERVICE_SEARCH
    value:  {{ index .Values "bs-service-map" | quote }}
  - name: EGOV_ES_PASSWORD
    valueFrom:
      secretKeyRef:
        key: password
        name: elasticsearch-master-credentials
  - name: SERVICES_ESINDEXER_PASSWORD
    valueFrom:
      secretKeyRef:
        key: password
        name: elasticsearch-master-credentials
  - name: LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_WEB_CLIENT
    value: "DEBUG"
  - name: INBOX_SHOW_CLOSED_APPLICATIONS
    value: "true"

# Common Labels
labels:
  app: "hcm-digit-ui"
  group: "web"

# Ingress Configs
ingress:
  enabled: true
  context: "chad/hcm-digit-ui"

# Init Containers Configs
initContainers: {}

# Container Configs
image:
  repository: "egovio/hcm-digit-ui"
  tag: "single-web-app-hcm-digit-ui-761fd76"
replicas: "1"
httpPort: 80
healthChecks:
  enabled: true
  livenessProbePath: "/"
  readinessProbePath: "/"

env: |
  - name: COUNTRY_PREFIX
    value: "chad"
  - name: BUILD_VARIANT
    value: "hcm-digit-ui"

namespace: egov    
extraVolumes: |
  - name: js-injection
    configMap:
      name: hcm-digit-ui-js-injection

extraVolumeMounts: |
  - mountPath: /etc/nginx/conf.d/sub_filter.conf
    name: js-injection
    subPath: sub_filter.conf

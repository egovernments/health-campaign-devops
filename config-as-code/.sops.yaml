# creation rules are evaluated sequentially, the first match wins
#
# On this branch every secrets file is encrypted against hcm-demo-v2-kv. The
# old environment's vault lives in hcm-demo-rg, so anything still pointing there
# becomes permanently undecryptable the moment that resource group is deleted.
creation_rules:
  - path_regex: environments/hcm-demo-v2-azure-secrets\.yaml$
    azure_keyvault: 'https://hcm-demo-v2-kv.vault.azure.net/keys/sops-key/a33af2d11f334f24abe955d0b7891ca8'
  - path_regex: environments/jupyterhub\-secrets\.yaml$
    azure_keyvault: 'https://hcm-demo-v2-kv.vault.azure.net/keys/sops-key/a33af2d11f334f24abe955d0b7891ca8'
  - path_regex: environments/dhis2\-secrets\.yaml$
    azure_keyvault: 'https://hcm-demo-v2-kv.vault.azure.net/keys/sops-key/a33af2d11f334f24abe955d0b7891ca8'

# creation rules are evaluated sequentially, the first match wins
creation_rules:
  # hcm-demo-v2 keeps its own key, so the parallel environment does not depend
  # on a vault that lives in the old environment's resource group. This rule
  # must stay above the dhis2 one, or a v2 secrets file would be re-encrypted
  # against hcm-demo-kv on the next edit.
  - path_regex: environments/hcm-demo-v2-azure-secrets\.yaml$
    azure_keyvault: 'https://hcm-demo-v2-kv.vault.azure.net/keys/sops-key/a33af2d11f334f24abe955d0b7891ca8'
  - path_regex: environments/dhis2\-secrets\.yaml$
    azure_keyvault: 'https://hcm-demo-kv.vault.azure.net/keys/sops-key/bd08e4ad057e40f790edcaae471b5959'

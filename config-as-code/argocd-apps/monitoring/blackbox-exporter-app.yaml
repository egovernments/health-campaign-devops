apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: blackbox
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: monitoring-stack
    app.kubernetes.io/managed-by: argocd
  annotations:
    monitoring-stack/managed: "true"
    monitoring-stack/do-not-deploy-standalone: "This app is managed by monitoring-stack"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-blackbox-exporter
      targetRevision: 8.2.0
      helm:
        releaseName: blackbox
        valueFiles:
          - $values/config-as-code/helm/charts/monitoring/hcm-demo-v2/blackbox.yaml
    - repoURL: git@github.com:egovernments/health-campaign-devops.git
      targetRevision: azure-install-hcm-demo-v2
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

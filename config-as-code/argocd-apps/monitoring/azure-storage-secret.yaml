apiVersion: v1
kind: Secret
metadata:
  name: azure-storage-secret
  namespace: monitoring
type: Opaque
stringData:
  account-key: "<AZURE_STORAGE_ACCOUNT_KEY>"
---
# NOTE: This secret should be created manually with the actual Azure Storage Account key
# Do NOT commit the actual key to git repository
#
# To create the secret manually:
# kubectl create secret generic azure-storage-secret \
#   --from-literal=account-key='YOUR_ACTUAL_ACCOUNT_KEY' \
#   -n monitoring
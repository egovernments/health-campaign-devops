apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: superset
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: hcm-demo
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://apache.github.io/superset
    chart: superset
    targetRevision: 0.22.7
    helm:
      values: |
        ingress:
          enabled: true
          ingressClassName: nginx
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
            nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
            nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
          path: /
          pathType: ImplementationSpecific
          hosts:
            - superset.health-demo-v2.digit.org
          tls:
            - secretName: superset.health-demo-v2.digit.org-tls-certs
              hosts:
                - superset.health-demo-v2.digit.org

        # The 6.x apache/superset image ships without DB drivers baked in;
        # install psycopg2 for the bundled Postgres metadata DB at pod startup.
        bootstrapScript: |
          #!/bin/bash
          if [ ! -f ~/bootstrap ]; then
            uv pip install --python /app/.venv/bin/python psycopg2-binary
            echo "Running Superset with uid {{ .Values.runAsUser }}" > ~/bootstrap
          fi

        # SUPERSET_SECRET_KEY is sourced from a pre-created in-cluster secret
        # (superset-app-secrets) rather than committed here. See
        # config-as-code/argocd-apps/demo/README.md for the bootstrap steps.
        envFromSecrets:
          - superset-app-secrets

        init:
          # Admin user is created manually after first sync (kubectl exec + `superset fab create-admin`)
          # so no plaintext password ever needs to live in this file or in Argo CD's Application CR.
          createAdmin: false
          loadExamples: false

        # Postgres and Redis are bundled, ClusterIP-only, internal to this
        # namespace. No passwords live in this file: Argo CD renders the chart
        # with `helm template`, so anything not pinned would be regenerated on
        # every sync, and the placeholders that used to be here were applied
        # literally on hcm-demo (its Superset can't reach its own DB).
        # Instead both sides read pre-created secrets rendered by
        # cluster-configs from the SOPS secrets file (cluster-configs.secrets.generic):
        #   superset-postgresql-auth - postgres-password / password for the DB
        #   superset-env             - DB_* / REDIS_* env for the Superset pods
        secretEnv:
          create: false
        postgresql:
          enabled: true
          auth:
            existingSecret: superset-postgresql-auth
          primary:
            resources:
              requests:
                cpu: "250m"
                memory: "1Gi"
              limits:
                cpu: "1000m"
                memory: "4Gi"


        redis:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: superset
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
